<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#130b07"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Cafe Strych</title><style>
:root{--b:#130b07;--p:#2b1912;--g:#d9a45b;--t:#fff0d8;--m:#c3a98b}*{box-sizing:border-box}html{min-height:100%;background:#130b07}body{margin:0;min-height:100vh;min-height:100dvh;background:linear-gradient(145deg,#25150e 0%,#100805 100%);background-color:#130b07;color:var(--t);font:15px system-ui}button,input,select{font:inherit}.hide{display:none!important}button{border:0;border-radius:12px;padding:10px 13px;font-weight:800}.primary{background:var(--g);color:#25140b}.ghost{background:#fff1;color:var(--t);border:1px solid #fff2}.danger{background:#d95d5228;color:#ffb2aa}.shell{max-width:1100px;margin:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 12px calc(100px + env(safe-area-inset-bottom,0px));min-height:100vh;min-height:100dvh}.panel,dialog{background:#2b1912f2;border:1px solid #7b5036;border-radius:22px;box-shadow:0 20px 50px #0008}.panel{padding:17px}.toolbar,.head,.card{display:flex;align-items:center;justify-content:space-between;gap:10px}.head{align-items:flex-start;margin-bottom:20px}.head button{flex:0 0 auto}.list{display:grid;gap:9px}.card{padding:12px;background:#fff1;border-radius:14px}.grow{flex:1}.card b,.card small{display:block}.actions{display:flex;gap:6px}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{min-height:105px;padding:8px;background:#fff1;border-radius:13px;cursor:pointer}.entry{margin-top:5px;padding:5px;background:#865531;border-radius:8px;font-size:11px}.nav{display:grid;grid-template-columns:48px 1fr 48px;gap:7px;margin:12px auto;max-width:400px}dialog{width:min(94%,720px);color:var(--t);padding:18px}dialog::backdrop{background:#000b}.addBtn{margin-bottom:15px}.muted{color:var(--m)}@media(max-width:650px){.grid{min-width:760px}.scroll{overflow:auto}.card{align-items:flex-start}.actions{flex-direction:column}}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(145deg,#25150e 0%,#100805 100%);pointer-events:none}</style></head><body><div class="shell"><div class="panel"><div class="toolbar"><h2>Rezerwacje</h2></div><div class="nav"><button class="ghost" onclick="move(-1)">‹</button><button class="primary" onclick="bookingForm()">+ Rezerwacja</button><button class="ghost" onclick="move(1)">›</button></div><div class="scroll"><div id="calendar" class="grid"></div></div><hr><div class="toolbar"><h2>Grafik</h2></div><div id="schedule" class="list"></div><hr><div class="toolbar"><h2>Produkty</h2><button class="primary" onclick="productForm()">+ Dodaj</button></div><div id="products" class="list"></div></div></div><dialog id="dlg"><form id="form"><div class="head"><h2 id="title"></h2><button type="button" class="ghost" onclick="dlg.close()">✕</button></div><div id="fields"></div><button id="save" class="primary" style="margin-top:15px">Zapisz</button></form></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient('https://dhqsjwanjrcblrhevfcq.supabase.co','sb_publishable_55XUZSnWLqML_VKscgI1Ow_AAWJiCTa'),$=s=>document.querySelector(s);let month=new Date(new Date().getFullYear(),new Date().getMonth(),1),bookings=[],shifts=[],products=[];const esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])),iso=d=>d.toISOString().slice(0,10);async function load(){let q=await Promise.all([sb.from('bookings').select('*'),sb.from('work_shifts').select('*,employees(full_name)'),sb.from('shopping').select('*')]);[bookings,shifts,products]=q.map(x=>x.data||[]);render()}function M(t,h,fn,show=true){title.textContent=t;fields.innerHTML=h;save.classList.toggle('hide',!show);form.onsubmit=async e=>{e.preventDefault();await fn()};dlg.showModal()}dlg.onclick=e=>{let r=dlg.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dlg.close()};function render(){renderCal();schedule.innerHTML=shifts.map(x=>`<div class="card"><div class="grow"><b>${esc(x.employees?.full_name)}</b><small>${x.shift_date} ${x.start_time.slice(0,5)}–${x.end_time.slice(0,5)}</small></div><button class="danger" onclick="delShift('${x.id}')">Usuń</button></div>`).join('');products.innerHTML=products.map(x=>`<div class="card"><div class="grow"><b>${esc(x.title)}</b><small>${esc(x.quantity)}</small></div><div class="actions"><button class="ghost" onclick="editProduct('${x.id}')">Edytuj</button><button class="danger" onclick="delProduct('${x.id}')">Usuń</button></div></div>`).join('')}function renderCal(){let f=new Date(month),s=new Date(f);s.setDate(1-(f.getDay()+6)%7);calendar.innerHTML='';for(let i=0;i<42;i++){let d=new Date(s);d.setDate(s.getDate()+i);let ds=iso(d),r=bookings.filter(x=>x.start_at.slice(0,10)===ds);calendar.innerHTML+=`<div class="day" onclick="openDay('${ds}')"><b>${d.getDate()}</b>${r.map(x=>`<div class="entry">${esc(x.title)} • ${x.guests_count} os.</div>`).join('')}</div>`}}window.move=n=>{month=new Date(month.getFullYear(),month.getMonth()+n,1);renderCal()};window.openDay=ds=>M(ds,`<button type="button" class="primary addBtn" onclick="dlg.close();bookingForm('${ds}')">+ Dodaj rezerwację</button><div class="list">${bookings.filter(x=>x.start_at.slice(0,10)===ds).map(x=>`<div class="card"><div class="grow"><b>${esc(x.title)}</b><small>${x.guests_count} os.</small></div><div class="actions"><button type="button" class="ghost" onclick="editBooking('${x.id}')">Edytuj</button><button type="button" class="danger" onclick="delBooking('${x.id}','${ds}')">Usuń</button></div></div>`).join('')}</div>`,async()=>{},false);window.bookingForm=(ds='')=>M('Rezerwacja',`<input id="bn" placeholder="Nazwa" required><input id="bg" type="number" placeholder="Osoby" required><input id="ba" type="datetime-local" value="${ds?ds+'T18:00':''}" required>`,async()=>{let a=new Date(ba.value);await sb.from('bookings').insert({title:bn.value,guests_count:+bg.value,start_at:a.toISOString(),end_at:new Date(a.getTime()+7200000).toISOString(),room:'Góra'});dlg.close();await load()});window.editBooking=id=>{let r=bookings.find(x=>x.id===id);M('Edytuj rezerwację',`<input id="bn" value="${esc(r.title)}"><input id="bg" type="number" value="${r.guests_count}">`,async()=>{await sb.from('bookings').update({title:bn.value,guests_count:+bg.value}).eq('id',id);dlg.close();await load()})};window.delBooking=async(id,ds)=>{await sb.from('bookings').delete().eq('id',id);await load();openDay(ds)};window.delShift=async id=>{await sb.from('work_shifts').delete().eq('id',id);await load()};window.productForm=()=>M('Produkt',`<input id="pn" placeholder="Nazwa"><input id="pq" placeholder="Ilość">`,async()=>{await sb.from('shopping').insert({title:pn.value,quantity:pq.value});dlg.close();await load()});window.editProduct=id=>{let r=products.find(x=>x.id===id);M('Edytuj produkt',`<input id="pn" value="${esc(r.title)}"><input id="pq" value="${esc(r.quantity)}">`,async()=>{await sb.from('shopping').update({title:pn.value,quantity:pq.value}).eq('id',id);dlg.close();await load()})};window.delProduct=async id=>{await sb.from('shopping').delete().eq('id',id);await load()};load();
</script></body></html>
